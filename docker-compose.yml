name: cineweave-rae

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./test-media:/test-media
      - ./fixtures:/fixtures
    env_file:
      - .env
    environment:
      - MEDIA_ROOT=/test-media/uploads
    command: python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=http://127.0.0.1:8000
    depends_on:
      - backend
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
